<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Checkout Form</h1>
    <form id="checkoutForm">
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" value="John" required>
        </div>
        
        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" value="Doe" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="john.doe@test.com" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" value="+1234567890" required>
        </div>
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="johndoe123" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="TestPass123!" required>
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" value="TestPass123!" required>
        </div>
        
        <div class="form-group">
            <label for="company">Company:</label>
            <input type="text" id="company" name="company" value="Test Company Inc.">
        </div>
        
        <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" value="New York">
        </div>
        
        <div class="form-group">
            <label for="planName">Plan:</label>
            <select id="planName" name="planName" required>
                <option value="Basic Monthly">Basic Monthly</option>
                <option value="Premium Monthly">Premium Monthly</option>
                <option value="Basic Annual">Basic Annual</option>
                <option value="Premium Annual">Premium Annual</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="planPrice">Plan Price:</label>
            <input type="number" id="planPrice" name="planPrice" value="29.99" step="0.01" required>
        </div>
        
        <div class="form-group">
            <label for="planCurrency">Currency:</label>
            <select id="planCurrency" name="planCurrency" required>
                <option value="USD">USD</option>
                <option value="PKR">PKR</option>
                <option value="EUR">EUR</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="planPeriod">Plan Period:</label>
            <select id="planPeriod" name="planPeriod" required>
                <option value="monthly">Monthly</option>
                <option value="annual">Annual</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" rows="3">Test order for database integration verification</textarea>
        </div>
        
        <div class="form-group">
            <label for="receiptFile">Receipt File:</label>
            <input type="file" id="receiptFile" name="receiptFile" accept="image/*,.pdf" required>
        </div>
        
        <button type="submit">Submit Test Order</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.innerHTML = '<p>Processing...</p>';
                
                const response = await fetch('http://localhost:5001/api/checkout', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>Success!</h3>
                            <p><strong>Message:</strong> ${result.message}</p>
                            <p><strong>User ID:</strong> ${result.data.user.id}</p>
                            <p><strong>Order ID:</strong> ${result.data.order.id}</p>
                            <p><strong>Plan:</strong> ${result.data.order.plan_name}</p>
                            <p><strong>Price:</strong> ${result.data.order.plan_price} ${result.data.order.plan_currency}</p>
                            <p><strong>Status:</strong> ${result.data.order.status}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>Error</h3>
                            <p>${result.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
